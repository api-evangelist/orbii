openapi: 3.2.0
info:
  title: Orbii API - Rewaa Rewaa KPI Rules API
  version: 1.0.4
  description: API for Rewaa.
servers:
- url: https://api.rewaa.orbii.ai/
tags:
- name: Rewaa KPI Rules
paths:
  /Rewaa_KPI_Rules:
    get:
      summary: KPI Rules
      operationId: getRewaaKpiRules
      parameters:
      - $ref: '#/components/parameters/UserQ'
      - $ref: '#/components/parameters/PasswordQ'
      - $ref: '#/components/parameters/PageQ'
      - $ref: '#/components/parameters/PageSizeQ'
      - in: query
        name: category
        schema:
          type: string
        description: Optional exact filter by Category
      - in: query
        name: kpi
        schema:
          type: string
        description: Optional exact filter by KPI
      responses:
        '200':
          description: Paged KPI rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedKpiRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      tags:
      - Rewaa KPI Rules
components:
  schemas:
    PagedKpiRules:
      allOf:
      - $ref: '#/components/schemas/PageEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/KpiRuleRow'
    PageEnvelope:
      type: object
      properties:
        total_records:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        page_size:
          type: integer
        data:
          type: array
          items:
            type: object
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: Missing 'user' or 'password' query parameters
    KpiRuleRow:
      type: object
      properties:
        Category:
          type: string
        KPI:
          type: string
        Rule:
          type: string
        Weightage:
          type: number
          format: double
        Threshold:
          type: number
          format: double
        Operator:
          type: string
        Logic:
          type: string
        RiskLowMessage:
          type: string
        RiskHighMessage:
          type: string
  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request (missing/invalid parameters)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PageQ:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page index
    UserQ:
      in: query
      name: user
      required: true
      schema:
        type: string
      description: Database username (also used to derive container for some endpoints)
    PageSizeQ:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1000
      description: Page size
    PasswordQ:
      in: query
      name: password
      required: true
      schema:
        type: string
      description: Database password
