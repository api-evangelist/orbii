        description: End date of the range (inclusive), format YYYY-MM-DD
        required: true
        schema:
          type: string
          format: date
      - name: user
        in: query
        description: username
        required: false
        schema:
          type: string
          default: username
      - name: password
        in: query
        description: password
        required: false
        schema:
          type: string
          default: DB_PASSWORD
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        description: Number of records per page
        required: false
        schema:
          type: integer
          default: 1000
          minimum: 1
      responses:
        '200':
          description: Paged list of transactions with merchant details for the specified customer ID and date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_records:
                    type: integer
                    description: Total number of matching transactions
                  page:
                    type: integer
                    description: Current page number
                  page_size:
                    type: integer
                    description: Number of records per page
                  total_pages:
                    type: integer
                    description: Total number of pages
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        ClientID:
                          type: string
                        BorrowerID:
                          type: string
                        date:
                          type: string
                          format: date
                        description:
                          type: string
                        credit_debit_indicator:
                          type: string
                        amount:
                          type: number
                          format: float
                        currency:
                          type: string
                        balance:
                          type: number
                          format: float
                        category:
                          type: string
                        subcategory:
                          type: string
                        risk level:
                          type: string
                        bank name:
                          type: string
                        iban:
                          type: string
                        cost type:
                          type: string
                        merchant:
                          type: string
                        interaction_type:
                          type: string
                        customer_id:
                          type: string
                        sr_no:
                          type: integer
        '400':
          description: Bad request - missing or invalid parameters
        '500':
          description: Internal server error
      operationId: getPagedTransactionsWithMerchantCustomerByCustomerIdRange
