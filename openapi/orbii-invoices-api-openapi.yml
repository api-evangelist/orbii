                  - suggested_loan: 437500.0
                    total_company_caps: 190000.0
                    total_allocated: 185000.0
                    unallocated_remainder: 252500.0
                    customer_id: 03789f7f-6b22-4319-aee8-c4d76dc93fd1
        '400':
