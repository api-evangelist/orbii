openapi: 3.2.0
info:
  title: Orbii Categories API
  description: API for managing transactions, clients, and companies.
  version: 1.0.5-oas3
servers:
- url: https://api.orbii.ai
  description: Production server
tags:
- name: Categories
paths:
  /categories/{clientname}:
    get:
      summary: Get distinct categories for a client
      description: Fetches distinct categories for a given client.
      tags:
      - Categories
      parameters:
      - name: clientname
        in: path
        required: true
        schema:
          type: string
      - name: user
        in: query
        schema:
          type: string
      - name: password
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A list of distinct categories for the client.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: getCategoriesByClientname
      x-operation-id-source: derived
