aid: orbii
name: Orbii
description: >-
  Orbii is a Riyadh-based credit infrastructure company providing AI-powered
  underwriting and lending infrastructure for banks, fintechs, neobanks, and B2B
  platforms across the MENA region. Its APIs ingest and enrich transaction and
  invoice data to produce borrower intelligence — client and predictive KPIs,
  risk assessments, band classifications, and suggested loan allocations — so
  lenders can launch SME lending products (salary advance, merchant financing,
  working capital, BNPL, embedded lending) without building an internal credit
  function. Orbii exposes region-specific REST APIs for Saudi Arabia (KSA), the
  United Arab Emirates (UAE), and Oman (OMN), documented on a SwaggerHub portal.
  Backed by a $3.6M seed round led by Prosus Ventures.
